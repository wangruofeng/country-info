<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>国家信息速查</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --border: #e5e7eb;
    --border-strong: #d1d5db;
    --text: #1f2328;
    --text-muted: #6b7280;
    --text-faint: #9ca3af;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-soft: #eff6ff;
    --danger: #dc2626;
    --danger-soft: #fef2f2;
    --success: #16a34a;
    --star: #f59e0b;
    --map-asia: #bfdbfe;
    --map-europe: #c4b5fd;
    --map-north-america: #a7f3d0;
    --map-south-america: #fbcfe8;
    --map-africa: #fde68a;
    --map-oceania: #bae6fd;
    --map-antarctica: #e5e7eb;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    --radius: 10px;
  }
  html.dark {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --border-strong: #484f58;
    --text: #e6edf3;
    --text-muted: #9198a1;
    --text-faint: #6e7681;
    --accent: #58a6ff;
    --accent-hover: #79b8ff;
    --accent-soft: #1a2332;
    --danger: #f87171;
    --danger-soft: #2a1a1c;
    --success: #3fb950;
    --star: #fbbf24;
    --map-asia: #1e3a5f;
    --map-europe: #35255f;
    --map-north-america: #164e43;
    --map-south-america: #5b2146;
    --map-africa: #5f4516;
    --map-oceania: #164e63;
    --map-antarctica: #30363d;
    --shadow: 0 1px 3px rgba(0,0,0,.4);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Header ---------- */
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 20px; background: var(--panel);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .logo { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 650; }
  .logo .mark {
    width: 30px; height: 30px; border-radius: 8px;
    display: grid; place-items: center;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    color: #fff; font-size: 16px; font-weight: 700; line-height: 1;
  }
  .logo .sub { font-size: 12px; color: var(--text-muted); font-weight: 400; }
  .spacer { flex: 1; }

  .icon-btn {
    width: 36px; height: 36px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--panel);
    color: var(--text-muted); cursor: pointer;
    display: grid; place-items: center; transition: all .15s; flex-shrink: 0;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--border-strong); background: var(--bg); }
  .icon-btn svg { width: 18px; height: 18px; }
  header .icon-btn { border: none; background: transparent; }
  header .icon-btn:hover { background: var(--bg); }

  /* ---------- 语言切换器 ---------- */
  .lang-wrap { position: relative; flex-shrink: 0; }
  .lang-btn { width: 36px; height: 36px; border-radius: 8px; border: 0; background: transparent; color: var(--text-muted); cursor: pointer; display: grid; place-items: center; transition: all .15s; font-size: 16px; }
  .lang-btn:hover { color: var(--text); background: var(--bg); }
  .lang-menu {
    position: absolute; top: calc(100% + 6px); right: 0; z-index: 100;
    min-width: 160px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; box-shadow: var(--shadow); padding: 6px;
    display: none;
  }
  .lang-menu.show { display: block; }
  .lang-item {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 8px 10px; border: 0; background: transparent; color: var(--text-muted);
    font-size: 13px; cursor: pointer; border-radius: 6px; transition: all .12s; text-align: left;
  }
  .lang-item:hover { background: var(--bg); color: var(--text); }
  .lang-item.active { color: var(--accent); background: var(--accent-soft); }
  .lang-item .check { margin-left: auto; color: var(--accent); }
  .lang-item:not(.active) .check { visibility: hidden; }

  /* ---------- Toolbar ---------- */
  .toolbar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 20px; background: var(--panel);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .search-wrap { flex: 1; position: relative; min-width: 0; }
  .search-wrap svg.search-icon {
    position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
    width: 16px; height: 16px; color: var(--text-faint); pointer-events: none;
  }
  #searchInput {
    width: 100%; height: 38px; padding: 0 34px 0 34px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--text); font-size: 14px;
    outline: none; transition: border .15s, box-shadow .15s;
  }
  #searchInput:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  #searchInput::placeholder { color: var(--text-faint); }
  .search-wrap .clear-btn {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    width: 22px; height: 22px; border-radius: 50%; border: 0;
    background: var(--border); color: var(--text-muted); cursor: pointer;
    display: none; align-items: center; justify-content: center; padding: 0;
  }
  .search-wrap .clear-btn:hover { background: var(--border-strong); color: var(--text); }
  .search-wrap .clear-btn.show { display: flex; }
  .search-wrap .clear-btn svg { width: 12px; height: 12px; }
  /* 「/ 聚焦搜索」快捷键提示徽标：聚焦或已有文字时隐藏 */
  .search-wrap .search-hint {
    position: absolute; right: 36px; top: 50%; transform: translateY(-50%);
    font-size: 12px; line-height: 1.4; color: var(--text-faint);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 1px 6px; background: var(--panel); pointer-events: none;
  }
  #searchInput:focus ~ .search-hint,
  .search-wrap .clear-btn.show ~ .search-hint { display: none; }
  @media (hover: none) { .search-wrap .search-hint { display: none; } }

  .stat { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
  .stat b { color: var(--text); font-weight: 600; }
  .view-toggle {
    height: 38px; padding: 0 11px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--panel); color: var(--text-muted); font-size: 13px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; transition: all .15s;
  }
  .view-toggle:hover, .view-toggle.active { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .view-toggle svg { width: 15px; height: 15px; }

  /* ---------- Region tabs ---------- */
  .tabs {
    display: flex; gap: 6px; overflow-x: auto;
    padding: 10px 20px; background: var(--panel);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab-btn {
    flex-shrink: 0; height: 32px; padding: 0 14px;
    border: 1px solid var(--border); border-radius: 16px;
    background: var(--panel); color: var(--text-muted); font-size: 13px;
    cursor: pointer; transition: all .15s; white-space: nowrap;
  }
  .tab-btn:hover { background: var(--bg); color: var(--text); border-color: var(--border-strong); }
  .tab-btn.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

  /* ---------- App body ---------- */
  .app-body { flex: 1; display: flex; overflow: hidden; }
  main {
    /* 顶部不留 padding：sticky 标题 pin 在 content-box 边缘，padding 透明带会让滚动内容穿透 */
    flex: 1; overflow-y: auto; padding: 0 20px 60px;
  }

  /* ---------- Sections & grid ---------- */
  .reg-section { margin-bottom: 28px; }
  /* 首屏顶部间距走 margin（随滚动滚走），不能放 main 的 padding */
  .reg-section:first-child { margin-top: 18px; }
  .reg-title {
    display: flex; align-items: center; gap: 10px;
    font-size: 15px; font-weight: 600; color: var(--text);
    /* 间距全走 padding（在背景内）：margin 透明带会让滚动内容穿透 pin 住的标题 */
    margin: 0; position: sticky; top: 0;
    background: var(--bg); padding: 8px 0 12px; z-index: 5;
  }
  .reg-title .count {
    font-size: 12px; color: var(--text-muted); font-weight: 400;
    background: var(--panel); border: 1px solid var(--border);
    padding: 2px 8px; border-radius: 10px;
  }
  .reg-title .title-clear {
    margin-left: auto; padding: 3px 10px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--panel);
    color: var(--text-muted); font-size: 12px; cursor: pointer; transition: all .12s;
  }
  .reg-title .title-clear:hover { color: var(--danger); border-color: var(--danger); background: var(--danger-soft); }
  .country-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(128px, 1fr));
    gap: 8px;
  }
  .country-card {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 12px 8px 10px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform .12s, border-color .12s, box-shadow .12s;
    position: relative;
  }
  .country-card:hover {
    transform: translateY(-2px);
    z-index: 6;
    border-color: var(--accent);
    box-shadow: 0 4px 12px rgba(37,99,235,.15);
  }
  .country-card.selected { border-color: var(--accent); background: var(--accent-soft); }
  .country-card .flag { font-size: 34px; line-height: 1.2; }
  .country-card .name {
    font-size: 13px; font-weight: 600; color: var(--text);
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .country-card .code {
    font-size: 11px; color: var(--text-faint);
    font-family: "SF Mono", "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace;
  }
  .fav-star {
    position: absolute; top: 3px; right: 3px;
    width: 20px; height: 20px; padding: 2px;
    border: 0; background: transparent; cursor: pointer;
    color: var(--text-faint); opacity: 0;
    transition: opacity .12s, color .12s, transform .12s;
  }
  .fav-star svg { width: 100%; height: 100%; display: block; }
  .country-card:hover .fav-star, .fav-star.on { opacity: 1; }
  .fav-star:hover { color: var(--star); transform: scale(1.15); }
  .fav-star.on { color: var(--star); }
  .fav-star.on svg { fill: currentColor; }
  /* 触屏无 hover：星标常显半透明，已收藏保持实色 */
  @media (hover: none) { .fav-star { opacity: .45; } .fav-star.on { opacity: 1; } }

  /* ---------- Empty state ---------- */
  .empty-state {
    max-width: 420px; margin: 10vh auto; text-align: center;
    color: var(--text-muted);
  }
  .empty-state .big { font-size: 56px; margin-bottom: 14px; }
  .empty-state h3 { margin: 0 0 8px; font-size: 17px; color: var(--text); }
  .empty-state p { margin: 0; font-size: 13.5px; line-height: 1.7; }

  /* ---------- Detail panel ---------- */
  .detail {
    width: 340px; flex-shrink: 0; background: var(--panel);
    border-left: 1px solid var(--border);
    display: flex; flex-direction: column; overflow-y: auto;
  }
  .detail.hidden { display: none; }
  .detail-head {
    padding: 16px 18px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
  }
  .detail-big {
    width: 72px; height: 72px; font-size: 46px;
    display: grid; place-items: center;
    background: var(--bg); border-radius: var(--radius);
    border: 1px solid var(--border); flex-shrink: 0;
  }
  .detail-names { min-width: 0; }
  .detail-names .cn { font-size: 16px; font-weight: 600; color: var(--text); margin: 0 0 4px; }
  .detail-names .en { font-size: 12px; color: var(--text-muted); margin: 0; word-break: break-word; }
  .detail-body { padding: 14px 18px 24px; }
  .detail-row {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 10px;
  }
  .detail-row label {
    width: 66px; flex-shrink: 0; font-size: 12px; color: var(--text-muted);
  }
  .detail-row .value {
    flex: 1; min-width: 0; font-size: 13px; color: var(--text);
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 8px;
    font-family: "SF Mono", "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .detail-row .copy-mini {
    width: 28px; height: 28px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--panel);
    color: var(--text-muted); cursor: pointer;
    display: grid; place-items: center; flex-shrink: 0;
  }
  .detail-row .copy-mini:hover { color: var(--accent); border-color: var(--accent); }
  .detail-row .copy-mini svg { width: 13px; height: 13px; }

  .detail-section-title {
    font-size: 13px; font-weight: 600; color: var(--text-muted);
    margin: 18px 0 10px; text-transform: uppercase; letter-spacing: .03em;
  }
  .detail-sub {
    font-size: 11px; color: var(--text-faint); margin: -6px 0 10px 74px;
  }
  .tz-time { color: var(--accent); }

  .detail-close {
    display: none; margin-left: 0;
    width: 28px; height: 28px; border-radius: 6px;
    border: 0; background: var(--bg); color: var(--text-muted); cursor: pointer;
  }
  .detail-close:hover { color: var(--text); }
  .detail-fav {
    margin-left: auto; flex-shrink: 0;
    width: 28px; height: 28px; border-radius: 6px; padding: 4px;
    border: 0; background: var(--bg); color: var(--text-muted); cursor: pointer;
    display: grid; place-items: center; transition: color .12s;
  }
  .detail-fav svg { width: 100%; height: 100%; }
  .detail-fav:hover { color: var(--star); }
  .detail-fav.on { color: var(--star); }
  .detail-fav.on svg { fill: currentColor; }

  /* ---------- 地图按钮 & 模态框 ---------- */
  .map-open {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 7px;
    padding: 9px 12px; font-size: 13px; cursor: pointer;
    color: var(--accent); background: var(--bg);
    border: 1px solid var(--border); border-radius: 8px; transition: all .15s;
  }
  .map-open:hover { border-color: var(--accent); }
  .map-open svg { width: 15px; height: 15px; flex-shrink: 0; }
  .map-modal {
    position: fixed; inset: 0; z-index: 300; padding: 24px;
    background: rgba(0,0,0,.5);
    display: none; align-items: center; justify-content: center;
  }
  .map-modal.show { display: flex; }
  .map-box {
    width: min(920px, 100%); height: min(640px, 100%);
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: 0 16px 48px rgba(0,0,0,.28);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .map-head {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-bottom: 1px solid var(--border);
  }
  .map-title {
    flex: 1; min-width: 0; font-size: 14px; font-weight: 600; color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .map-head .icon-btn { width: 30px; height: 30px; border-radius: 6px; }
  .map-head .icon-btn svg { width: 15px; height: 15px; }
  .map-frame { flex: 1; border: 0; width: 100%; background: var(--bg); }

  /* ---------- 世界地图模式 ---------- */
  .world-map-view {
    height: 100%; min-height: 440px; margin-top: 18px;
    display: flex; flex-direction: column; overflow: hidden;
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .world-map-stage { position: relative; flex: 1; min-height: 380px; background: var(--accent-soft); touch-action: none; }
  .world-map-canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .world-country {
    fill: var(--panel); stroke: var(--border-strong); stroke-width: .65;
    vector-effect: non-scaling-stroke; cursor: pointer; transition: fill .12s;
  }
  .world-country.map-asia { fill: var(--map-asia); }
  .world-country.map-europe { fill: var(--map-europe); }
  .world-country.map-north-america { fill: var(--map-north-america); }
  .world-country.map-south-america { fill: var(--map-south-america); }
  .world-country.map-africa { fill: var(--map-africa); }
  .world-country.map-oceania { fill: var(--map-oceania); }
  .world-country.map-antarctica { fill: var(--map-antarctica); }
  .world-country:hover, .world-country:focus { fill: var(--accent-soft); outline: none; }
  .world-country.selected { fill: var(--accent); stroke: var(--accent-hover); }
  .world-map-status {
    position: absolute; inset: 0; display: grid; place-items: center;
    padding: 20px; color: var(--text-muted); font-size: 13px; text-align: center;
  }
  .world-map-credit {
    position: absolute; right: 10px; bottom: 7px; color: var(--text-faint); font-size: 11px;
    pointer-events: none;
  }
  .world-map-controls {
    position: absolute; top: 10px; right: 10px; z-index: 2;
    display: flex; align-items: center; overflow: hidden;
    border: 1px solid var(--border); border-radius: 7px; background: var(--panel); box-shadow: var(--shadow);
  }
  .map-zoom-btn {
    width: 31px; height: 31px; padding: 0; border: 0; background: transparent; color: var(--text);
    font-size: 18px; line-height: 1; cursor: pointer;
  }
  .map-zoom-btn + .map-zoom-btn { border-left: 1px solid var(--border); }
  .map-zoom-btn:hover:not(:disabled) { background: var(--accent-soft); color: var(--accent); }
  .map-zoom-btn:disabled { color: var(--text-faint); cursor: default; }
  .map-zoom-reset { width: 43px; font-size: 11px; color: var(--text-muted); }
  .map-help {
    width: 31px; height: 31px; padding: 0; border: 0; background: transparent;
    color: var(--text-muted); cursor: help; display: grid; place-items: center;
  }
  .map-help + .map-zoom-btn { border-left: 1px solid var(--border); }
  .map-help:hover, .map-help:focus { background: var(--accent-soft); color: var(--accent); outline: none; }
  .map-help svg { width: 16px; height: 16px; }
  main.map-active { padding: 0; overflow: hidden; }
  main.map-active .world-map-view {
    min-height: 0; margin: 0; border: 0; border-radius: 0; box-shadow: none;
  }
  main.map-active .world-map-stage { min-height: 0; }

  /* ---------- Toast ---------- */
  #toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--panel);
    padding: 9px 16px; border-radius: 8px; font-size: 13px;
    box-shadow: 0 8px 24px rgba(0,0,0,.2);
    opacity: 0; pointer-events: none; transition: all .22s;
    z-index: 200; display: flex; align-items: center; gap: 7px;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast svg { width: 15px; height: 15px; }

  /* ---------- Tooltip ---------- */
  #tooltip {
    position: fixed; z-index: 150; pointer-events: none;
    background: var(--text); color: var(--panel);
    padding: 5px 10px; border-radius: 6px; font-size: 12px;
    opacity: 0; transform: translate(-50%, -100%); margin-top: -8px;
    transition: opacity .12s; white-space: nowrap;
  }
  #tooltip.show { opacity: 1; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 6px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }

  @media (max-width: 768px) {
    header { padding: 12px 14px; }
    .toolbar { padding: 8px 14px; }
    .tabs { padding: 8px 14px; }
    main { padding: 0 14px 50px; }
    .reg-section:first-child { margin-top: 12px; }
    .logo .sub { display: none; }
    .country-grid { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; }
    .app-body { flex-direction: column; }
    .detail {
      width: auto; border-left: 0; border-top: 1px solid var(--border);
      max-height: 45vh; display: none;
    }
    .detail.visible { display: flex; }
    .detail-close { display: grid; }
    .map-modal { padding: 10px; }
    .view-toggle { padding: 0 10px; }
    .world-map-view { min-height: 360px; margin-top: 12px; }
    .world-map-stage { min-height: 320px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="mark">🌐</div>
    <div>
      <span id="appTitle">国家信息速查</span>
      <div class="sub" id="appSub">国家码 / 货币 / 区号 / 时区</div>
    </div>
  </div>

/* ---------- i18n 核心 ---------- */
// 取当前语言文案。key 为 I18N 的键；vars 为占位替换对象。
function t(key, vars) {
  const dict = I18N[key];
  let s = (dict && dict[lang]) || (dict && dict['en']) || (dict && dict['zh-CN']) || key;
  if (vars) for (const k in vars) s = s.split('{' + k + '}').join(vars[k]);
  return s;
}
// 取国家显示名（回退：当前语言映射 -> zh-CN cn -> en）
function localName(c) {
  if (lang === 'en') return c.en || c.cn;
  const map = COUNTRY_NAMES[lang];
  if (map && map[c.a2]) return map[c.a2];
  if (lang === 'zh-CN' || lang === 'zh-TW') return c.cn || c.en;
  return c.en || c.cn;
}
// 取大洲显示名（key 为内部中文大洲名）
function localReg(reg) {
  const m = REG_I18N[reg];
  return (m && m[lang]) || (m && m['en']) || reg;
}
// 取 tab 显示名：全部走 t()，大洲走 localReg()
function localTabLabel(key) {
  if (key === '全部') return t('all');
  if (key === '收藏') return t('favoritesTab');
  if (key === '最近使用') return t('recentTitle');
  return localReg(key);
}
// Intl 用的 locale（时间/货币格式化）
function intlLocale() {
  return lang === 'zh-TW' ? 'zh-Hant' : lang;
}

/* ---------- 搜索 ---------- */
function matchCountry(c, q) {
  const ql = q.toLowerCase();
  // 中文名/官方名（简繁中文搜索）
  if (c.cn.includes(q) || c.off.includes(q)) return true;
  // 英文名（所有语言始终支持）
  if (c.en.toLowerCase().includes(ql)) return true;
  // 当前语言的本地化名（ja/ko/th/ms/zh-TW）
  const map = COUNTRY_NAMES[lang];
  if (map && map[c.a2] && map[c.a2].toLowerCase().includes(ql)) return true;
  if (c.a2.toLowerCase() === ql || c.a3.toLowerCase() === ql) return true;
  if (c.n3 === ql) return true;
  if (c.tel && (c.tel === q || c.tel.replace('+', '') === ql.replace('+', ''))) return true;
  if (c.tld && c.tld === ql) return true;
  return c.kw.some(k => k.toLowerCase().includes(ql));
}

function visibleCountries() {
  let list = COUNTRY_DATA;
  if (activeTab === '收藏') list = list.filter(c => favs.has(c.a2));
  else if (activeTab === '最近使用') list = recent.map(byA2).filter(Boolean);
  else if (activeTab !== '全部') list = list.filter(c => c.reg === activeTab);
  if (query) list = list.filter(c => matchCountry(c, query));
  return list;
}

function byA2(a2) { return COUNTRY_DATA.find(c => c.a2 === a2); }

function loadWorldGeoJSON() {
  if (!worldGeoJSONPromise) {
    worldGeoJSONPromise = fetch(WORLD_GEOJSON_URL)
      .then(r => {
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return r.json();
      })
      .then(data => {
        if (!Array.isArray(data.features)) throw new Error('Invalid GeoJSON');
        return data;
      })
      .catch(err => {
        worldGeoJSONPromise = null;
        throw err;
      });
  }
  return worldGeoJSONPromise;
}

function mapPoint(point) {
  const lon = Math.max(-180, Math.min(180, Number(point[0])));
  const lat = Math.max(-90, Math.min(90, Number(point[1])));
  return [((lon + 180) / 360 * 1000).toFixed(2), ((90 - lat) / 180 * 500).toFixed(2)];
}

function mapPath(geometry) {
  const polygons = geometry.type === 'Polygon' ? [geometry.coordinates] : geometry.coordinates;
  return polygons.map(polygon => polygon.map(ring => ring.map((point, i) => {
    const [x, y] = mapPoint(point);
    return `${i ? 'L' : 'M'}${x},${y}`;
  }).join('') + 'Z').join('')).join('');
}

function setWorldMapViewport(svg, zoom, panX = 0, panY = 0) {
  const next = Math.max(1, Math.min(4, Math.round(zoom * 100) / 100));
  const maxX = 500 * (next - 1);
  const maxY = 250 * (next - 1);
  const x = Math.max(-maxX, Math.min(maxX, panX));
  const y = Math.max(-maxY, Math.min(maxY, panY));
  const layer = svg.querySelector('.world-map-layer');
  if (!layer) return;
  layer.setAttribute('transform', `translate(${500 * (1 - next) + x} ${250 * (1 - next) + y}) scale(${next})`);
  svg.dataset.zoom = String(next);
  svg.dataset.panX = String(x);
  svg.dataset.panY = String(y);
  const out = svg.parentElement.querySelector('[data-map-zoom="out"]');
  const reset = svg.parentElement.querySelector('[data-map-zoom="reset"]');
  if (out) out.disabled = next === 1;
  if (reset) reset.textContent = `${Math.round(next * 100)}%`;
}

function setWorldMapZoom(svg, zoom) {
  const currentZoom = Number(svg.dataset.zoom || 1);
  const factor = zoom / currentZoom;
  setWorldMapViewport(
    svg,
    zoom,
    zoom === 1 ? 0 : Number(svg.dataset.panX || 0) * factor,
    zoom === 1 ? 0 : Number(svg.dataset.panY || 0) * factor,
  );
}

function mapGestureIntent(panDistance, distanceChange) {
  const threshold = 8;
  if (Math.max(panDistance, distanceChange) < threshold) return null;
  return distanceChange >= panDistance ? 'pinch' : 'pan';
}

function enableMapGestures(stage, svg) {
  const pointers = new Map();
  let gesture = null;
  const startGesture = () => {
    if (pointers.size !== 2) return;
    if (Number(svg.dataset.zoom || 1) === 1) setWorldMapZoom(svg, 1.5);
    const [a, b] = [...pointers.values()];
    gesture = {
      x: (a.x + b.x) / 2,
      y: (a.y + b.y) / 2,
      distance: Math.hypot(a.x - b.x, a.y - b.y),
      zoom: Number(svg.dataset.zoom || 1),
      panX: Number(svg.dataset.panX || 0),
      panY: Number(svg.dataset.panY || 0),
      moved: new Set(),
      mode: null,
    };
  };
  stage.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'touch') return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    startGesture();
  });
  stage.addEventListener('pointermove', e => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (!gesture || pointers.size !== 2) return;
    gesture.moved.add(e.pointerId);
    if (gesture.moved.size < 2) return;
    const [a, b] = [...pointers.values()];
    const rect = svg.getBoundingClientRect();
    const midpointX = (a.x + b.x) / 2;
    const midpointY = (a.y + b.y) / 2;
    const distance = Math.hypot(a.x - b.x, a.y - b.y);
    if (!gesture.mode) {
      gesture.mode = mapGestureIntent(
        Math.hypot(midpointX - gesture.x, midpointY - gesture.y),
        Math.abs(distance - gesture.distance),
      );
      if (!gesture.mode) return;
    }
    if (gesture.mode === 'pinch') {
      setWorldMapViewport(svg, gesture.zoom * distance / gesture.distance, gesture.panX, gesture.panY);
    } else {
      setWorldMapViewport(
        svg,
        gesture.zoom,
        gesture.panX + ((midpointX - gesture.x) * 1000 / rect.width),
        gesture.panY + ((midpointY - gesture.y) * 500 / rect.height),
      );
    }
    e.preventDefault();
  }, { passive: false });
  const endGesture = e => {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) gesture = null;
  };
  stage.addEventListener('pointerup', endGesture);
  stage.addEventListener('pointercancel', endGesture);
  stage.addEventListener('wheel', e => {
    let zoom = Number(svg.dataset.zoom || 1);
    if (e.ctrlKey || e.metaKey) {
      setWorldMapZoom(svg, zoom * Math.exp(-e.deltaY * .01));
      e.preventDefault();
      return;
    }
    if (zoom <= 1) {
      setWorldMapZoom(svg, 1.5);
      zoom = 1.5;
    }
    const rect = svg.getBoundingClientRect();
    setWorldMapViewport(
      svg,
      zoom,
      Number(svg.dataset.panX || 0) - e.deltaX * 1000 / rect.width,
      Number(svg.dataset.panY || 0) - e.deltaY * 500 / rect.height,
    );
    e.preventDefault();
  }, { passive: false });
}

function drawWorldMap(svg, status, token, countries) {
  loadWorldGeoJSON().then(data => {
    if (token !== worldMapRenderToken || !svg.isConnected) return;
    status.remove();
    const countriesByA3 = new Map(COUNTRY_DATA.map(c => [c.a3, c]));
    const visibleA3 = new Set(countries.map(c => c.a3));
    for (const feature of data.features) {
      const country = countriesByA3.get(feature.id);
      if (!country || !visibleA3.has(country.a3) || !feature.geometry || !['Polygon', 'MultiPolygon'].includes(feature.geometry.type)) continue;
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.classList.add('world-country');
      path.classList.add(worldMapRegionClass(country.reg));
      path.dataset.a2 = country.a2;
      path.setAttribute('d', mapPath(feature.geometry));
      path.setAttribute('fill-rule', 'evenodd');
      path.setAttribute('tabindex', '0');
      path.setAttribute('role', 'button');
      path.setAttribute('aria-label', localName(country));
      const label = document.createElementNS('http://www.w3.org/2000/svg', 'title');
      label.textContent = `${country.flag} ${localName(country)} · ${country.en}`;
      path.appendChild(label);
      path.addEventListener('mouseenter', e => showTooltip(e.currentTarget, `${country.flag} ${localName(country)} · ${country.en}`));
      path.addEventListener('mouseleave', hideTooltip);
      path.addEventListener('click', () => selectCountry(country.a2));
      path.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectCountry(country.a2); }
      });
      svg.querySelector('.world-map-layer').appendChild(path);
    }
    syncMapSelection();
  }).catch(() => {
    if (token === worldMapRenderToken && status.isConnected) status.textContent = t('mapFailed');
  });
}

function worldMapEl(countries) {
  const wrap = document.createElement('section');
  wrap.className = 'world-map-view';
  const stage = document.createElement('div');
  stage.className = 'world-map-stage';
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.classList.add('world-map-canvas');
  svg.setAttribute('viewBox', '0 0 1000 500');
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  svg.setAttribute('aria-label', t('worldMap'));
  svg.setAttribute('role', 'img');
  const layer = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  layer.classList.add('world-map-layer');
  const status = document.createElement('div');
  status.className = 'world-map-status';
  status.textContent = t('mapLoading');
  const credit = document.createElement('span');
  credit.className = 'world-map-credit';
  credit.textContent = t('mapCredit');
  const controls = document.createElement('div');
  controls.className = 'world-map-controls';
  const help = document.createElement('button');
  help.className = 'map-help';
  help.type = 'button';
  help.title = t('worldMapHint');
  help.setAttribute('aria-label', t('worldMapHint'));
  help.innerHTML = SVG_INFO;
  help.addEventListener('mouseenter', () => showTooltip(help, t('worldMapHint'), 'end'));
  help.addEventListener('mouseleave', hideTooltip);
  help.addEventListener('focus', () => showTooltip(help, t('worldMapHint'), 'end'));
  help.addEventListener('blur', hideTooltip);
  controls.appendChild(help);
  const zoomButton = (key, text, action) => {
    const btn = document.createElement('button');
    btn.className = 'map-zoom-btn' + (key === 'reset' ? ' map-zoom-reset' : '');
    btn.type = 'button';
    btn.dataset.mapZoom = key;
    btn.title = t(key === 'in' ? 'mapZoomIn' : key === 'out' ? 'mapZoomOut' : 'mapZoomReset');
    btn.setAttribute('aria-label', btn.title);
    btn.textContent = text;
    btn.addEventListener('click', action);
    controls.appendChild(btn);
  };
  zoomButton('out', '−', () => setWorldMapZoom(svg, Number(svg.dataset.zoom || 1) - .5));
  zoomButton('reset', '100%', () => setWorldMapZoom(svg, 1));
  zoomButton('in', '+', () => setWorldMapZoom(svg, Number(svg.dataset.zoom || 1) + .5));
  svg.appendChild(layer);
  stage.appendChild(svg);
  stage.appendChild(status);
  stage.appendChild(controls);
  stage.appendChild(credit);
  wrap.appendChild(stage);
  setWorldMapZoom(svg, 1);
  enableMapGestures(stage, svg);
  drawWorldMap(svg, status, ++worldMapRenderToken, countries);
  return wrap;
}

function renderMain() {
  mainEl.textContent = '';
  const list = visibleCountries();
  mainEl.classList.toggle('map-active', viewMode === 'map');
  // 重建统计条（本地化文案 + 粗体数字，数字用 textContent 安全写入）
  const statBar = $('statBar');
  statBar.textContent = '';
  const tmpl = t('stat', { n: list.length, m: COUNTRY_DATA.length });
  const parts = tmpl.split(/(\d+)/);
  for (const p of parts) {
    if (p === '') continue;
    if (/^\d+$/.test(p)) { const b = document.createElement('b'); b.textContent = p; statBar.appendChild(b); }
    else statBar.appendChild(document.createTextNode(p));
  }

  if (viewMode === 'map') {
    mainEl.appendChild(worldMapEl(list));
    return;
  }

  if (!list.length) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    const big = document.createElement('div');
    big.className = 'big';
    const isFavorites = activeTab === '收藏';
    big.textContent = isFavorites ? '⭐' : '🔍';
    const h3 = document.createElement('h3');
    h3.textContent = t(isFavorites ? 'favEmptyT' : 'emptyT');
    const p = document.createElement('p');
    p.textContent = t(isFavorites ? 'favEmptyD' : 'emptyD');
    empty.appendChild(big); empty.appendChild(h3); empty.appendChild(p);
    mainEl.appendChild(empty);
    return;
  }

  if (activeTab === '全部') {
    for (const reg of REGIONS) {
      const sub = list.filter(c => c.reg === reg);
      if (sub.length) mainEl.appendChild(sectionEl(localReg(reg), sub));
    }
  } else if (activeTab === '最近使用') {
    mainEl.appendChild(sectionEl(t('recentTitle'), list, {
      clearable: true,
      onClear: () => { recent = []; writeLS(LS_RECENT, []); renderMain(); toast(t('recentCleared')); },
    }));
  } else {
    mainEl.appendChild(sectionEl(activeTab === '收藏' ? t('favTitle') : localReg(activeTab), list));
  }
}

/* ---------- 收藏 / 最近 ---------- */
function toggleFav(a2) {
  if (favs.has(a2)) { favs.delete(a2); toast(t('favRemove')); }
  else { favs.add(a2); toast(t('favAdd')); }
  writeLS(LS_FAV, [...favs]);
  syncStars();
  refreshDetailFav();
  if (activeTab === '收藏') renderMain();
}

function pushRecent(a2) {
  recent = [a2, ...recent.filter(x => x !== a2)].slice(0, RECENT_MAX);
  writeLS(LS_RECENT, recent);
  if (activeTab === '最近使用') renderMain();
}

function syncStars() {
  document.querySelectorAll('.country-card').forEach(card => {
    const star = card.querySelector('.fav-star');
    if (star) star.classList.toggle('on', favs.has(card.dataset.a2));
  });
}

/* ---------- 详情面板 ---------- */
function detailRow(labelText, valueText, copyText, valueClass) {
  const row = document.createElement('div');
  row.className = 'detail-row';
  const label = document.createElement('label');
  label.textContent = labelText;
  const value = document.createElement('div');
  value.className = 'value' + (valueClass ? ' ' + valueClass : '');
  value.textContent = valueText;
  value.title = valueText;
  const btn = document.createElement('button');
  btn.className = 'copy-mini';
  btn.title = t('copyPrefix') + ' ' + labelText;
  btn.innerHTML = SVG_COPY; // 静态常量
  btn.addEventListener('click', () => copyText_(copyText ?? valueText, labelText));
  row.appendChild(label); row.appendChild(value); row.appendChild(btn);
  return row;
}

function sectionTitle(text) {
  const d = document.createElement('div');
  d.className = 'detail-section-title';
  d.textContent = text;
  return d;
}

function tzTimeStr(tz) {
  try {
    const time = new Intl.DateTimeFormat(intlLocale(), {
      timeZone: tz, hour: '2-digit', minute: '2-digit', hour12: false,
    }).format(new Date());
    const parts = new Intl.DateTimeFormat('en', {
      timeZone: tz, timeZoneName: 'shortOffset',
    }).formatToParts(new Date());
    const offset = (parts.find(p => p.type === 'timeZoneName') || {}).value || '';
    return `${time} · ${offset.replace('GMT', 'UTC')}`;
  } catch { return ''; }
}

function renderDetail() {
  const c = byA2(selectedA2);
  if (!c) return;
  $('detailBig').textContent = c.flag || '🏳️';
  $('detailCn').textContent = localName(c);
  $('detailEn').textContent = c.en;

  detailBody.textContent = '';

  detailBody.appendChild(sectionTitle(t('codeInfo')));
  detailBody.appendChild(detailRow('CCA2', c.a2));
  detailBody.appendChild(detailRow('CCA3', c.a3));
  if (c.n3) detailBody.appendChild(detailRow(t('numCode'), c.n3));
  if (c.tld) detailBody.appendChild(detailRow(t('tld'), c.tld));
  if (c.tel) detailBody.appendChild(detailRow(t('dialCode'), c.tel));

  detailBody.appendChild(sectionTitle(t('basicInfo')));
  detailBody.appendChild(detailRow(t('official'), lang === 'en' ? c.en : (lang === 'zh-CN' ? c.off : localName(c))));
  if (c.cap) detailBody.appendChild(detailRow(t('capital'), c.cap));
  detailBody.appendChild(detailRow(t('region'), localReg(c.reg)));
  if (c.lang) detailBody.appendChild(detailRow(t('language'), c.lang));

  detailBody.appendChild(sectionTitle(t('mapSec')));
  const mapBtn = document.createElement('button');
  mapBtn.className = 'map-open';
  mapBtn.innerHTML = SVG_MAP; // 静态常量
  mapBtn.appendChild(document.createTextNode(t('viewMap')));
  mapBtn.addEventListener('click', () => openMap(c));
  detailBody.appendChild(mapBtn);

  if (c.cur.length) {
    detailBody.appendChild(sectionTitle(t('currency')));
    for (const cur of c.cur) {
      detailBody.appendChild(detailRow(cur.c, `${cur.s ? cur.s + ' ' : ''}${cur.n}`, cur.c));
      let preview = '';
      try {
        preview = new Intl.NumberFormat(intlLocale(), { style: 'currency', currency: cur.c }).format(1234.56);
      } catch { /* 不支持币种跳过 */ }
      if (preview) {
        const sub = document.createElement('div');
        sub.className = 'detail-sub';
        sub.textContent = t('curFmt', { x: preview });
        detailBody.appendChild(sub);
      }
    }
  }

  if (c.tz.length) {
    detailBody.appendChild(sectionTitle(t('tzTitle')));
    // moment-timezone 含别名时区（如 Detroit 同 New York），按当前时间+偏移去重
    const seen = new Set();
    const zones = c.tz.filter(tz => {
      const s = tzTimeStr(tz);
      if (seen.has(s)) return false;
      seen.add(s);
      return true;
    });
    const show = zones.slice(0, 5);
    for (const tz of show) {
      detailBody.appendChild(detailRow(tz.split('/').pop().replace(/_/g, ' '), `${tzTimeStr(tz)}`, tz, 'tz-time'));
    }
    if (zones.length > 5) {
      const sub = document.createElement('div');
      sub.className = 'detail-sub';
      sub.textContent = t('tzOverflow', { n: zones.length });
      detailBody.appendChild(sub);
    }
  }
  refreshDetailFav();
}

function refreshDetailFav() {
  const btn = $('detailFav');
  btn.innerHTML = SVG_STAR;
  btn.classList.toggle('on', !!selectedA2 && favs.has(selectedA2));
}

function selectCountry(a2) {
  selectedA2 = a2;
  renderDetail();
  detailEl.classList.remove('hidden');
  detailEl.classList.add('visible');
  document.querySelectorAll('.country-card').forEach(card =>
    card.classList.toggle('selected', card.dataset.a2 === a2));
  syncMapSelection();
  pushRecent(a2);
  startTzTimer();
}

function closeDetail() {
  selectedA2 = null;
  detailEl.classList.add('hidden');
  detailEl.classList.remove('visible');
  stopTzTimer();
  document.querySelectorAll('.country-card.selected').forEach(el => el.classList.remove('selected'));
  syncMapSelection();
}

/* 详情打开时每 30s 刷新时区时间 */
function startTzTimer() {
  stopTzTimer();
  tzTimer = setInterval(() => { if (selectedA2) renderDetail(); }, 30000);
}
function stopTzTimer() {
  if (tzTimer) { clearInterval(tzTimer); tzTimer = null; }
}

/* ---------- 地图查看 ---------- */
// 内嵌 Google Maps（output=embed 免 key），按英文名定位自动取景；外链用官方 search URL
function openMap(c) {
  $('mapTitle').textContent = `${c.flag} ${localName(c)}`;
  $('mapFrame').src = `https://maps.google.com/maps?q=${encodeURIComponent(c.en)}&hl=${lang}&output=embed`;
  $('mapExt').href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(c.en)}`;
  $('mapModal').classList.add('show');
}
function closeMap() {
  $('mapModal').classList.remove('show');
  $('mapFrame').src = ''; // 停止加载、释放资源
}
$('mapClose').addEventListener('click', closeMap);
$('mapModal').addEventListener('click', e => { if (e.target === $('mapModal')) closeMap(); });

/* ---------- 复制 / Toast / Tooltip ---------- */
let toastTimer = null;
function toast(msg) {
  const el = $('toast');
  el.innerHTML = SVG_CHECK; // 静态常量
  el.appendChild(document.createTextNode(msg));
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1600);
}

async function copyText_(text, label) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
  }
  toast(t('copied', { l: label || t('copyPrefix'), t: text }));
}

const tooltipEl = $('tooltip');
function showTooltip(anchor, text, align = 'center') {
  tooltipEl.textContent = text;
  const r = anchor.getBoundingClientRect();
  tooltipEl.style.left = (r.left + r.width / 2) + 'px';
  tooltipEl.style.top = r.top + 'px';
  tooltipEl.style.transform = align === 'end' ? 'translate(-100%, -100%)' : '';
  tooltipEl.classList.add('show');
}
function hideTooltip() { tooltipEl.classList.remove('show'); tooltipEl.style.transform = ''; }

/* ---------- 主题 ---------- */
function applyTheme(theme) {
  document.documentElement.classList.toggle('dark', theme === 'dark');
  $('themeBtn').innerHTML = theme === 'dark' ? SVG_SUN : SVG_MOON;
}
function initTheme() {
  const saved = localStorage.getItem(LS_THEME);
  const theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  applyTheme(theme);
}
$('themeBtn').addEventListener('click', () => {
  const next = document.documentElement.classList.contains('dark') ? 'light' : 'dark';
  applyTheme(next);
  try { localStorage.setItem(LS_THEME, next); } catch { /* 忽略 */ }
});

/* ---------- 事件 ---------- */
searchInput.addEventListener('input', () => {
  query = searchInput.value.trim();
  clearSearchBtn.classList.toggle('show', !!searchInput.value);
  renderMain();
});
clearSearchBtn.addEventListener('click', () => {
  searchInput.value = '';
  query = '';
  clearSearchBtn.classList.remove('show');
  renderMain();
  searchInput.focus();
});
$('detailClose').addEventListener('click', closeDetail);
$('detailFav').addEventListener('click', () => { if (selectedA2) toggleFav(selectedA2); });
$('viewToggle').addEventListener('click', () => {
  viewMode = viewMode === 'map' ? 'list' : 'map';
  renderViewToggle();
  renderMain();
});

document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
  if (e.key === '/' && !typing) {
    e.preventDefault();
    searchInput.focus();
    searchInput.select();
  } else if (e.key === 'Escape') {
    if (viewMode === 'map') {
      viewMode = 'list';
      renderViewToggle();
      renderMain();
    } else if (typing) {
      searchInput.value = '';
      query = '';
      clearSearchBtn.classList.remove('show');
      renderMain();
      searchInput.blur();
    } else if ($('mapModal').classList.contains('show')) {
      closeMap();
    } else if (selectedA2) {
      closeDetail();
    }
  }
});

/* ---------- 语言切换 ---------- */
// 根据浏览器语言猜测初始语言（无本地保存时）
function detectLang() {
  const nav = (navigator.language || navigator.userLanguage || 'zh-CN').toLowerCase();
  if (nav.startsWith('zh-tw') || nav.startsWith('zh-hant')) return 'zh-TW';
  if (nav.startsWith('zh')) return 'zh-CN';
  if (nav.startsWith('ja')) return 'ja';
  if (nav.startsWith('ko')) return 'ko';
  if (nav.startsWith('th')) return 'th';
  if (nav.startsWith('ms')) return 'ms';
  if (nav.startsWith('en')) return 'en';
  return 'zh-CN';
}

// 应用静态 HTML 元素的本地化文案
function applyStaticI18n() {
  document.title = t('title');
  document.documentElement.lang = lang;
  $('appTitle').textContent = t('title');
  $('appSub').textContent = t('subtitle');
  const gh = $('githubLink');
  gh.title = t('githubTitle');
  gh.setAttribute('aria-label', t('githubTitle'));
  $('langBtn').title = t('langTitle');
  $('langBtn').setAttribute('aria-label', t('langTitle'));
  searchInput.placeholder = t('searchPh');
  clearSearchBtn.title = t('clearSearch');
  // 带标记的 title / aria-label
  document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.dataset.i18nTitle); });
  document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
}

// 切换语言：保存、刷新界面与全量重渲染
function setLang(code) {
  if (!LANGS[code]) return;
  lang = code;
  try { localStorage.setItem(LS_LANG, code); } catch { /* 忽略 */ }
  renderLangMenu();
  applyStaticI18n();
  renderViewToggle();
  renderTabs();
  renderMain();
  if (selectedA2) renderDetail();
}

// 构建语言下拉菜单
function renderLangMenu() {
  const menu = $('langMenu');
  menu.textContent = '';
  for (const code of Object.keys(LANGS)) {
    const item = document.createElement('button');
    item.className = 'lang-item' + (lang === code ? ' active' : '');
    item.setAttribute('role', 'menuitem');
    item.textContent = LANGS[code];
    const check = document.createElement('span');
    check.className = 'check';
    check.textContent = '✓';
    item.appendChild(check);
    item.addEventListener('click', () => {
      setLang(code);
      menu.classList.remove('show');
    });
    menu.appendChild(item);
  }
}
$('langBtn').addEventListener('click', e => {
  e.stopPropagation();
  $('langMenu').classList.toggle('show');
});
document.addEventListener('click', e => {
  if (!e.target.closest('.lang-wrap')) $('langMenu').classList.remove('show');
});

/* ---------- 启动 ---------- */
// 先确定语言（本地保存 -> 浏览器语言 -> 默认 zh-CN），再渲染
try {
  const savedLang = localStorage.getItem(LS_LANG);
  lang = (savedLang && LANGS[savedLang]) ? savedLang : detectLang();
} catch { lang = detectLang(); }
initTheme();
renderLangMenu();
applyStaticI18n();
renderViewToggle();
renderTabs();
renderMain();
</script>
